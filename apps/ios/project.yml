# Zephyr iOS —— XcodeGen 工程描述（归属 X）。
#
#   cd apps/ios && xcodegen generate   → Zephyr.xcodeproj（不入库）
#   scripts/bootstrap.sh               → 安装 xcodegen + 生成 + 打开
#
# CI（.github/workflows/mobile.yml, job ios）：
#   xcodebuild -project Zephyr.xcodeproj -scheme Zephyr \
#     -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test
# 因此：scheme 必须叫 Zephyr；test action 必须在无签名的模拟器上跑通。
# 无签名时 entitlements 不生效（App Group 容器可能为 nil），Shared/Core/AppGroup.swift 有回退目录。
#
# Targets
#   Zephyr                 App（极薄：@main、引擎注入、深链、App Intents、实时活动驱动）
#   PacketTunnel           NEPacketTunnelProvider（mihomo 以静态库嵌入；当前链接桩实现）
#   ZephyrWidgets          WidgetKit：主屏/锁屏小组件、实时活动 + 灵动岛、iOS 18 控制中心开关
#   ZephyrTests            单测：Shared/Core、PacketTunnel 的纯逻辑部分（不托管于 App）
#   ZephyrSnapshotTests    swift-snapshot-testing：页面/组件/小组件 × 深浅 × AX5 × 强调色
# scheme Zephyr 的 test 还跑本地包的 ZephyrKitTests / ZephyrMockTests。

name: Zephyr

options:
  bundleIdPrefix: app.zephyr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    # App Group / 通知名统一由这里注入到 Info.plist（ZephyrAppGroup 键），代码里也有同名常量兜底。
    ZEPHYR_APP_GROUP: group.app.zephyr.mobile
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ZephyrKit:
    path: Packages/ZephyrKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:

  # ───────────────────────── App ─────────────────────────
  Zephyr:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
      - path: Shared/Core
        group: Shared
      - path: Shared/Intents
        group: Shared
      - path: Shared/LiveActivity
        group: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Zephyr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSCameraUsageDescription: 扫描订阅二维码时需要使用相机。
        NSLocalNetworkUsageDescription: 用于局域网设备通过本地端口共享代理。
        ZephyrAppGroup: $(ZEPHYR_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: app.zephyr.mobile
            CFBundleURLSchemes:
              - zephyr
          - CFBundleURLName: app.zephyr.mobile.clash
            CFBundleURLSchemes:
              - clash
              - mihomo
    entitlements:
      path: App/Zephyr.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile
        PRODUCT_NAME: Zephyr
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Release:
          # 置位后若 ZephyrCore 模块可导入则使用 CoreEngine，否则仍回落 MockEngine（见 App/EngineFactory.swift）。
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "ZEPHYR_CORE_ENGINE $(inherited)"
    dependencies:
      - package: ZephyrKit
        product: ZephyrKit
      - package: ZephyrKit
        product: ZephyrMock
      - package: ZephyrKit
        product: ZephyrDesign
      - package: ZephyrKit
        product: ZephyrFeatures
      - target: ZephyrCore
        embed: false
      - target: PacketTunnel
        embed: true
      - target: ZephyrWidgets
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework

  # ───────────────────────── ZephyrCore ─────────────────────────
  # Rust core-mobile（UniFFI）+ CoreEngine。静态框架；xcframework 由 tools/build-ios-xcframework.sh 生成到 build/ios（CI 在 xcodegen 之前构建）。
  ZephyrCore:
    type: framework
    platform: iOS
    sources:
      - path: Core
        excludes:
          - "**/*.md"
      - path: ../../core-mobile/bindings/swift/ZephyrMobileCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.core
        PRODUCT_NAME: ZephyrCore
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        # UniFFI 生成代码不按 Swift 6 严格并发写，单独放宽到 minimal，避免警告淹没日志。
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - framework: ../../build/ios/ZephyrMobileCore.xcframework
        embed: false
      - package: ZephyrKit
        product: ZephyrKit
      - package: ZephyrKit
        product: ZephyrMock

  # ───────────────────────── PacketTunnel ─────────────────────────
  # NE 扩展内存上限约 50 MB：不链接任何 SwiftUI / ZephyrDesign / ZephyrFeatures。
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "**/*.md"
          - "**/*.h"
      # C 头文件只作为桥接头引用，不进任何 build phase。
      - path: PacketTunnel/MihomoBridge/include
        group: PacketTunnel/MihomoBridge
        buildPhase: none
      - path: Shared/Core
        group: Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Zephyr Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ZephyrAppGroup: $(ZEPHYR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ZephyrPacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/PacketTunnel/MihomoBridge/include/PacketTunnel-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        # 接入真 mihomo 时（A 提供 Mihomo.xcframework 后）：
        #   1. 在下方 dependencies 加 `- framework: Vendor/Mihomo.xcframework`（embed: false，静态库）
        #   2. 这里改为 SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MIHOMO_LINKED $(inherited)"
        #   3. OTHER_LDFLAGS 加 -lresolv（Go 运行时需要）
        OTHER_LDFLAGS: "$(inherited)"
    dependencies:
      - sdk: NetworkExtension.framework

  # ───────────────────────── Widgets ─────────────────────────
  ZephyrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "**/*.md"
      - path: Shared/Core
        group: Shared
      - path: Shared/Intents
        group: Shared
      - path: Shared/LiveActivity
        group: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Zephyr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ZephyrAppGroup: $(ZEPHYR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ZephyrWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.Widgets
        PRODUCT_NAME: ZephyrWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: ZephyrKit
        product: ZephyrKit
      - package: ZephyrKit
        product: ZephyrDesign
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework

  # ───────────────────────── Tests ─────────────────────────
  # 不托管（无 TEST_HOST）：直接编译被测源文件，避免与 App 的静态包产物重复链接。
  ZephyrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared/Tests
      - path: Shared/Core
        group: Shared
      - path: PacketTunnel/TunnelNetworkSettingsFactory.swift
        group: PacketTunnel
      - path: PacketTunnel/TunnelConfiguration.swift
        group: PacketTunnel
      - path: PacketTunnel/MihomoBridge/MihomoBridge.swift
        group: PacketTunnel
      - path: PacketTunnel/MappedFile.swift
        group: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: NetworkExtension.framework

  # 真 Rust 核心端到端（模拟器）。不托管：直接编译 CoreEngine + UniFFI 绑定。
  ZephyrCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoreTests
      - path: Core
        excludes:
          - "**/*.md"
      - path: ../../core-mobile/bindings/swift/ZephyrMobileCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.core-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - framework: ../../build/ios/ZephyrMobileCore.xcframework
        embed: false
      - package: ZephyrKit
        product: ZephyrKit
      - package: ZephyrKit
        product: ZephyrMock

  ZephyrSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapshotTests
        excludes:
          - "__Snapshots__/**"
          - "**/*.md"
      # 小组件视图与实时活动视图也在这里做快照（它们不依赖 WidgetKit 运行时）。
      - path: Widgets/Views
        group: Widgets
      - path: Shared/Core
        group: Shared
      - path: Shared/Intents
        group: Shared
      - path: Shared/LiveActivity
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zephyr.mobile.snapshot-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ZephyrKit
        product: ZephyrKit
      - package: ZephyrKit
        product: ZephyrMock
      - package: ZephyrKit
        product: ZephyrDesign
      - package: ZephyrKit
        product: ZephyrFeatures
      - package: SnapshotTesting
        product: SnapshotTesting
      - sdk: WidgetKit.framework

schemes:
  Zephyr:
    build:
      targets:
        Zephyr: all
        PacketTunnel: all
        ZephyrWidgets: all
        ZephyrTests: [test]
        ZephyrCoreTests: [test]
        ZephyrSnapshotTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-ZephyrEngine mock": true
      environmentVariables:
        ZEPHYR_LOG_LEVEL: info
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Zephyr
      targets:
        - name: ZephyrTests
          parallelizable: true
        - name: ZephyrSnapshotTests
          parallelizable: false
        - package: ZephyrKit/ZephyrKitTests
        - package: ZephyrKit/ZephyrMockTests
      environmentVariables:
        # 快照：缺参考图时录制且不失败（首跑 CI）；SNAPSHOT_RECORD=all 强制重录。
        SNAPSHOT_RECORD: missing
        TZ: Asia/Shanghai
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
