[package]
name = "core-ohos"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "HarmonyOS（OpenHarmony）napi 薄层：把 core-mobile（zephyr-mobile-core）的少量 API 导出给 ArkTS。产物 libcore_ohos.so。"

# 独立 workspace：不并入其它 Cargo 工程，target/ 落在本目录（已被 apps/harmony/native/.gitignore 忽略）。
[workspace]

[lib]
crate-type = ["cdylib"]
name = "core_ohos"

[dependencies]
zephyr-mobile-core = { path = "../../../../core-mobile" }
napi-ohos = { version = "1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive-ohos = "1"

[build-dependencies]
napi-build-ohos = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
