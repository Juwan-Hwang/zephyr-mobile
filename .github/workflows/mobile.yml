name: mobile
on:
  # agent/** 分支走 pull_request 即可；push 只跑 main，避免每次推送双跑（macOS 队列是瓶颈）
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      record_android_snapshots:
        description: 'Android：重录 Paparazzi 基线（tokens 改动后用），录出的图作为 artifact android-snapshots 上传，人工审核后入库（本地套用：tools/apply-snapshot-artifacts.sh <run-id> --android [--dark-only]）'
        type: boolean
        default: false
      record_ios_snapshots:
        description: 'iOS：重录全部快照参考图（ZEPHYR_SNAPSHOT_RECORD=all，tokens 改动后用），录出的图作为 artifact ios-snapshots 上传，人工审核后入库（本地套用：tools/apply-snapshot-artifacts.sh <run-id> --ios [--dark-only]）'
        type: boolean
        default: false
      record_ios26_snapshots:
        description: 'iOS 26：在 macos-26（Xcode 26，iOS 26 模拟器）上用 scheme ZephyrGlass 重录 Liquid Glass 快照（J-4），录出的图作为 artifact ios26-snapshots 上传，人工审核后入库到 apps/ios/GlassSnapshotTests/__Snapshots__'
        type: boolean
        default: false
concurrency:
  # main 每个合并提交单独一组：GitHub 同组只保留一个排队中的 run，按 ref 分组时连续合并会把中间的 run 取消（83ff46d、389dfe9）。
  # PR 分支仍按 ref 分组，新推送取消旧的。
  group: mobile-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.d.outputs.ios }}
      android: ${{ steps.d.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ios=$([ -f apps/ios/project.yml ] && echo true || echo false)
          android=$([ -f apps/android/settings.gradle.kts ] && echo true || echo false)
          # PR 只跑受影响的平台：共享层（core/mihomo/tokens/contract/tools/CI）改动两端都跑
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            shared='^(core-mobile/|mihomo-mobile/|tokens/|contract/|tools/|vendor/|\.github/|\.gitmodules$)'
            if ! echo "$changed" | grep -qE "$shared"; then
              echo "$changed" | grep -q '^apps/ios/' || ios=false
              echo "$changed" | grep -q '^apps/android/' || android=false
            fi
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tokens 产物最新
        run: node tokens/build.mjs --check
      - name: tokens 对比度（WCAG AA，浅/深）
        run: node tools/check-token-contrast.mjs
      - name: fixtures 与原型一致
        run: node tools/gen-mock-fixtures.js && git diff --exit-code contract/fixtures
      - name: command parse fixtures match prototype
        run: node tools/gen-command-parse-fixtures.mjs --check
      - name: UniFFI / 鸿蒙 napi 导出均写入契约
        run: node tools/check-contract-exports.mjs
      - name: 契约样本结构自检（可解析、主键唯一、字段类型）
        run: node tools/check-fixtures.mjs
      - name: 三端术语终版对齐（contract/i18n）
        run: node tools/check-glossary.mjs
      - name: 鸿蒙术语资源最新（contract/i18n → tokens/generated/harmony）
        run: node tools/gen-harmony-i18n.mjs --check
      - name: tools/*.sh 通过 shellcheck
        run: shellcheck --version | sed -n 2p && shellcheck tools/*.sh
      - name: tools 脚本里变量后不紧跟全角字符（bash 3.2 会把 UTF-8 字节并进变量名，报 unbound variable；写成 ${name}）
        run: |
          if bad=$(grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' --include='*.sh' tools/); then
            echo "$bad"; echo "::error::上面几行的变量后紧跟非 ASCII 字符，请改成 \${var}"; exit 1
          fi
      - name: workflow 通过 actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core-mobile }
      - name: rustfmt 格式（core-mobile/rustfmt.toml）
        working-directory: core-mobile
        run: cargo fmt --check
      - name: clippy 零警告
        working-directory: core-mobile
        run: cargo clippy --lib --tests -- -D warnings
      - name: clippy 零警告（--no-default-features，即不带 uniffi；鸿蒙 core-ohos 的依赖方式）
        working-directory: core-mobile
        run: cargo clippy --lib --tests --no-default-features -- -D warnings
      - name: rustdoc 零警告
        working-directory: core-mobile
        env: { RUSTDOCFLAGS: '-D warnings' }
        run: cargo doc --no-deps --lib
      - name: 单测
        working-directory: core-mobile
        run: cargo test --lib
      - name: 全量 1310 万节点对照原型
        working-directory: core-mobile
        run: cargo test --release --test full_scale -- --ignored
      - name: UniFFI 绑定无漂移
        run: tools/gen-bindings.sh --check
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: 地理数据快照（tools/fetch-geodata.sh，按 tools/geodata.lock 校验 sha256；供各端打包，docs/geodata.md）
        run: tools/fetch-geodata.sh "$RUNNER_TEMP/geodata"
      - uses: actions/upload-artifact@v4
        with: { name: geodata, path: '${{ runner.temp }}/geodata/*', retention-days: 14, if-no-files-found: error }
      - name: 嵌入式 mihomo 冒烟（启动/重载/停止 + 加载 core-mobile 生成的运行时配置 + 地理数据：本地有不联网、缺了有界报错）
        env:
          ZM_RUNTIME_CONFIG: ${{ runner.temp }}/rt.yaml
          ZM_GEODATA_DIR: ${{ runner.temp }}/geodata
        run: |
          (cd core-mobile && cargo test --lib -- --exact scene_api::tests::emit_for_mihomo_smoke_with_scenes)
          cd mihomo-mobile && go test -count=1 ./...
      - name: mihomo-mobile gofmt + go vet
        working-directory: mihomo-mobile
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "未 gofmt：$unformatted"; exit 1; fi
          go vet ./...
  ios26:
    # J-4：iOS 26 Liquid Glass 快照录图 / 校验线。macos-15（Xcode 16）只编译 ZGlass 的回退分支，玻璃只能在这里看到。
    # 只跑 scheme ZephyrGlass（宿主 ZephyrGlassHost + ZephyrGlassSnapshotTests，#311），scheme Zephyr 的 142 张基线不在这里跑。
    # 校验暂不阻塞（continue-on-error）：iOS 26 基线入库并稳定后再去掉。
    needs: detect
    if: ${{ inputs.record_ios26_snapshots || needs.detect.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    continue-on-error: ${{ !inputs.record_ios26_snapshots }}
    env:
      SIM: iPhone 17
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Xcode / 模拟器版本
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: 预启动模拟器
        run: xcrun simctl boot "$SIM" || true
      - id: nk
        name: 原生库缓存键（与 ios 任务相同）
        run: echo "key=$(git rev-parse HEAD:vendor/zephyr)-${{ hashFiles('core-mobile/src/**', 'core-mobile/Cargo.*', 'core-mobile/bindings/**', 'mihomo-mobile/**', 'tools/build-ios-xcframework.sh', 'tools/build-mihomo.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ncache
        uses: actions/cache@v4
        with: { path: build/ios, key: 'ios-native-${{ steps.nk.outputs.key }}' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ncache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { workspaces: core-mobile }
      - name: ZephyrMobileCore.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-ios-xcframework.sh
      - uses: actions/setup-go@v5
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: Zmihomo.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-mihomo.sh ios
      - run: brew install xcodegen
      - name: generate
        timeout-minutes: 5
        working-directory: apps/ios
        run: xcodegen generate
      - name: iOS 26 玻璃快照（scheme ZephyrGlass；record 或校验）
        working-directory: apps/ios
        run: |
          set -o pipefail
          # 只在录图时设置；校验时不设，scheme 的 SNAPSHOT_RECORD=never 生效（缺图即失败）。
          if [ "${{ inputs.record_ios26_snapshots }}" = "true" ]; then export TEST_RUNNER_ZEPHYR_SNAPSHOT_RECORD=all; fi
          xcrun simctl bootstatus "$SIM" -b || true
          PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)
          xcodebuild -project "$PROJ" -scheme ZephyrGlass \
            -destination "platform=iOS Simulator,name=$SIM" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/Test26.xcresult \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit 1
      - if: ${{ inputs.record_ios26_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: ios26-snapshots, path: apps/ios/GlassSnapshotTests/__Snapshots__ }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ios26-xcresult, path: apps/ios/build/Test26.xcresult }
  ios:
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: 预启动模拟器（与原生库构建并行，减少首个快照测试的冷启动等待）
        run: xcrun simctl boot 'iPhone 16' || true
      - id: nk
        name: 原生库缓存键（core-mobile / mihomo-mobile / zephyr 子模块 / 构建脚本）
        run: echo "key=$(git rev-parse HEAD:vendor/zephyr)-${{ hashFiles('core-mobile/src/**', 'core-mobile/Cargo.*', 'core-mobile/bindings/**', 'mihomo-mobile/**', 'tools/build-ios-xcframework.sh', 'tools/build-mihomo.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ncache
        uses: actions/cache@v4
        with: { path: build/ios, key: 'ios-native-${{ steps.nk.outputs.key }}' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ncache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { workspaces: core-mobile }
      - name: ZephyrMobileCore.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-ios-xcframework.sh
      - uses: actions/setup-go@v5
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: Zmihomo.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-mihomo.sh ios
      - run: brew install xcodegen
      - name: generate
        timeout-minutes: 5
        working-directory: apps/ios
        run: xcodegen generate
      - name: build & test
        if: ${{ !inputs.record_ios_snapshots }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcrun simctl bootstatus 'iPhone 16' -b || true
          PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)
          SCHEME=${IOS_SCHEME:-Zephyr}
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -parallel-testing-enabled NO \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit 1
      - name: Release 构建（真机 arm64，-O + 非 DEBUG 分支，不签名；build number = run_number）
        if: ${{ !inputs.record_ios_snapshots }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)
          SCHEME=${IOS_SCHEME:-Zephyr}
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/Release \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify || exit 1
      - name: snapshot record（手动触发，只跑 ZephyrSnapshotTests）
        if: ${{ inputs.record_ios_snapshots }}
        working-directory: apps/ios
        env:
          TEST_RUNNER_ZEPHYR_SNAPSHOT_RECORD: all
        run: |
          set -o pipefail
          PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)
          SCHEME=${IOS_SCHEME:-Zephyr}
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -parallel-testing-enabled NO \
            -only-testing:ZephyrSnapshotTests \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit 1
      - if: ${{ inputs.record_ios_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: ios-snapshots, path: apps/ios/SnapshotTests/__Snapshots__ }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ios-xcresult, path: apps/ios/build/Test.xcresult }
  android:
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" >/dev/null
      - id: nk
        name: 原生库缓存键（core-mobile / mihomo-mobile / zephyr 子模块 / 构建脚本）
        run: echo "key=$(git rev-parse HEAD:vendor/zephyr)-${{ hashFiles('core-mobile/src/**', 'core-mobile/Cargo.*', 'core-mobile/bindings/**', 'mihomo-mobile/**', 'tools/build-android-libs.sh', 'tools/build-mihomo.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ncache
        uses: actions/cache@v4
        with: { path: apps/android/core-engine/src/main/jniLibs, key: 'android-native-${{ steps.nk.outputs.key }}' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ncache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { workspaces: core-mobile }
      - name: core-mobile .so（→ core-engine/src/main/jniLibs，不入库）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked && ABIS="arm64-v8a x86_64" tools/build-android-libs.sh
      - uses: actions/setup-go@v5
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: libzmihomo.so（→ jniLibs，不入库）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: ABIS="arm64-v8a x86_64" tools/build-mihomo.sh android
      - name: build, unit test, paparazzi verify
        if: ${{ !inputs.record_android_snapshots }}
        working-directory: apps/android
        run: ./gradlew --no-daemon -Pzephyr.rust=true -Pzephyr.strict16k=true assembleDebug testDebugUnitTest verifyPaparazziDebug
      - name: Release 构建（R8 + shrinkResources，APK 与 AAB；16 KB 对齐严格）
        if: ${{ !inputs.record_android_snapshots }}
        working-directory: apps/android
        # zephyr.versionCode：P1-1 规则，build number = run_number；app/build.gradle.kts 读取前不生效。
        run: ./gradlew --no-daemon -Pzephyr.rust=true -Pzephyr.strict16k=true -Pzephyr.versionCode=${{ github.run_number }} assembleRelease bundleRelease
      - name: 上传 debug APK（给 android-16k 任务复用，不重编）
        if: ${{ !inputs.record_android_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: android-debug-apk, path: apps/android/app/build/outputs/apk/debug/*.apk, retention-days: 3, if-no-files-found: error }
      - name: paparazzi record（手动触发）
        if: ${{ inputs.record_android_snapshots }}
        working-directory: apps/android
        run: ./gradlew --no-daemon -Pzephyr.rust=true recordPaparazziDebug
      - if: ${{ inputs.record_android_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: android-snapshots, path: apps/android/**/src/test/snapshots/images }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: paparazzi-failures, path: apps/android/**/build/paparazzi/failures }
  android-16k:
    # 非阻塞：16 KB 页大小模拟器（google_apis_ps16k）上确认 App 打包的 .so 真能加载。
    # 复用 android 任务的 debug APK；getconf PAGE_SIZE 必须是 16384；逐个 dlopen APK 里的 .so（含 libzmihomo.so、libzephyr_mobile_core.so）；
    # 再启动 MainActivity 查 logcat。脚本见 tools/android-16k/load-test.sh。模拟器偶发起不来属基础设施问题，不挡合并。
    needs: [detect, android]
    if: ${{ needs.detect.outputs.android == 'true' && !inputs.record_android_snapshots }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-debug-apk, path: build/apk }
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 编译 dlopen 探针（NDK，x86_64）
        run: tools/android-16k/load-test.sh build-probe build/probe && ls -la build/apk
      - name: 16 KB 模拟器加载测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          # 默认 AVD 内存太小，App 刚起来就被 lowmemorykiller 杀掉（首轮 run 45447925979）
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/android-16k/load-test.sh run "$(ls build/apk/*.apk | head -1)" build/probe/zm-dlopen
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-16k-logcat, path: /tmp/*log*.txt, if-no-files-found: ignore }
