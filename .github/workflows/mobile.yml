name: mobile
on:
  # agent/** 分支走 pull_request 即可；push 只跑 main，避免每次推送双跑（macOS 队列是瓶颈）
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      record_android_snapshots:
        description: 'Android：重录 Paparazzi 基线（tokens 改动后用），录出的图作为 artifact android-snapshots 上传，人工审核后入库'
        type: boolean
        default: false
      record_ios_snapshots:
        description: 'iOS：重录全部快照参考图（ZEPHYR_SNAPSHOT_RECORD=all，tokens 改动后用），录出的图作为 artifact ios-snapshots 上传，人工审核后入库'
        type: boolean
        default: false
concurrency:
  group: mobile-${{ github.ref }}
  # main 每次合并都要有完整结果（排队而非互相取消）；PR 分支新推送取消旧的
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.d.outputs.ios }}
      android: ${{ steps.d.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ios=$([ -f apps/ios/project.yml ] && echo true || echo false)
          android=$([ -f apps/android/settings.gradle.kts ] && echo true || echo false)
          # PR 只跑受影响的平台：共享层（core/mihomo/tokens/contract/tools/CI）改动两端都跑
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            shared='^(core-mobile/|mihomo-mobile/|tokens/|contract/|tools/|vendor/|\.github/|\.gitmodules$)'
            if ! echo "$changed" | grep -qE "$shared"; then
              echo "$changed" | grep -q '^apps/ios/' || ios=false
              echo "$changed" | grep -q '^apps/android/' || android=false
            fi
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tokens 产物最新
        run: node tokens/build.mjs --check
      - name: fixtures 与原型一致
        run: node tools/gen-mock-fixtures.js && git diff --exit-code contract/fixtures
      - name: command parse fixtures match prototype
        run: node tools/gen-command-parse-fixtures.mjs --check
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core-mobile }
      - name: clippy 零警告
        working-directory: core-mobile
        run: cargo clippy --lib --tests -- -D warnings
      - name: 单测
        working-directory: core-mobile
        run: cargo test --lib
      - name: 全量 1310 万节点对照原型
        working-directory: core-mobile
        run: cargo test --release --test full_scale -- --ignored
      - name: UniFFI 绑定无漂移
        run: tools/gen-bindings.sh --check
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: 嵌入式 mihomo 冒烟（启动/重载/停止 + 加载 core-mobile 生成的运行时配置）
        env:
          ZM_RUNTIME_CONFIG: ${{ runner.temp }}/rt.yaml
        run: |
          (cd core-mobile && cargo test --lib -- --exact scene_api::tests::emit_for_mihomo_smoke_with_scenes)
          cd mihomo-mobile && go test -count=1 ./...
  ios:
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - id: nk
        name: 原生库缓存键（core-mobile / mihomo-mobile / zephyr 子模块 / 构建脚本）
        run: echo "key=$(git rev-parse HEAD:vendor/zephyr)-${{ hashFiles('core-mobile/src/**', 'core-mobile/Cargo.*', 'core-mobile/bindings/**', 'mihomo-mobile/**', 'tools/build-ios-xcframework.sh', 'tools/build-mihomo.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ncache
        uses: actions/cache@v4
        with: { path: build/ios, key: 'ios-native-${{ steps.nk.outputs.key }}' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ncache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { workspaces: core-mobile }
      - name: ZephyrMobileCore.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-ios-xcframework.sh
      - uses: actions/setup-go@v5
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: Zmihomo.xcframework（→ build/ios）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: tools/build-mihomo.sh ios
      - run: brew install xcodegen
      - name: generate
        timeout-minutes: 5
        working-directory: apps/ios
        run: xcodegen generate
      - name: build & test
        if: ${{ !inputs.record_ios_snapshots }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=${IOS_SCHEME:-Zephyr}
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit 1
      - name: snapshot record（手动触发，只跑 ZephyrSnapshotTests）
        if: ${{ inputs.record_ios_snapshots }}
        working-directory: apps/ios
        env:
          TEST_RUNNER_ZEPHYR_SNAPSHOT_RECORD: all
        run: |
          set -o pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=${IOS_SCHEME:-Zephyr}
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ZephyrSnapshotTests \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify || exit 1
      - if: ${{ inputs.record_ios_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: ios-snapshots, path: apps/ios/SnapshotTests/__Snapshots__ }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ios-xcresult, path: apps/ios/build/Test.xcresult }
  android:
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" >/dev/null
      - id: nk
        name: 原生库缓存键（core-mobile / mihomo-mobile / zephyr 子模块 / 构建脚本）
        run: echo "key=$(git rev-parse HEAD:vendor/zephyr)-${{ hashFiles('core-mobile/src/**', 'core-mobile/Cargo.*', 'core-mobile/bindings/**', 'mihomo-mobile/**', 'tools/build-android-libs.sh', 'tools/build-mihomo.sh') }}" >> "$GITHUB_OUTPUT"
      - id: ncache
        uses: actions/cache@v4
        with: { path: apps/android/core-engine/src/main/jniLibs, key: 'android-native-${{ steps.nk.outputs.key }}' }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ncache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { workspaces: core-mobile }
      - name: core-mobile .so（→ core-engine/src/main/jniLibs，不入库）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked && ABIS="arm64-v8a x86_64" tools/build-android-libs.sh
      - uses: actions/setup-go@v5
        if: steps.ncache.outputs.cache-hit != 'true'
        with: { go-version: '1.27', cache-dependency-path: mihomo-mobile/go.sum }
      - name: libzmihomo.so（→ jniLibs，不入库）
        if: steps.ncache.outputs.cache-hit != 'true'
        run: ABIS="arm64-v8a x86_64" tools/build-mihomo.sh android
      - name: build, unit test, paparazzi verify
        if: ${{ !inputs.record_android_snapshots }}
        working-directory: apps/android
        run: ./gradlew --no-daemon -Pzephyr.rust=true assembleDebug testDebugUnitTest verifyPaparazziDebug
      - name: paparazzi record（手动触发）
        if: ${{ inputs.record_android_snapshots }}
        working-directory: apps/android
        run: ./gradlew --no-daemon -Pzephyr.rust=true recordPaparazziDebug
      - if: ${{ inputs.record_android_snapshots }}
        uses: actions/upload-artifact@v4
        with: { name: android-snapshots, path: apps/android/**/src/test/snapshots/images }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: paparazzi-failures, path: apps/android/**/build/paparazzi/failures }
